name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

# Pages deployment permissions set karo
permissions:
  contents: read
  pages: write
  id-token: write

# Ek time pe ek hi deployment chalni chahiye
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Root setup taaki nested dependencies lock files break na karein
      - name: Install root dependencies
        run: npm ci

      # Dashboard build karo aur page upload karo
      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
